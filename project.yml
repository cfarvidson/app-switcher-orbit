name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitTests: [test]
    test:
      targets:
        - OrbitTests

targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - path: Orbit
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Orbit/Resources/Orbit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.appswitcher
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Orbit/Info.plist
        COMBINE_HIDPI_IMAGES: true
        # Developer ID rather than ad-hoc ("-"). An ad-hoc signature makes the
        # app's TCC identity its cdhash, which changes on every build, so the
        # Accessibility grant Orbit needs for its hotkey and for pasting
        # dictated text died silently after every rebuild. A stable identity
        # makes the requirement identifier + team, which survives rebuilds.
        CODE_SIGN_IDENTITY: "Developer ID Application: Arvidson Tech AB (D3LY7SL2HW)"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: D3LY7SL2HW
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          # Required for Developer ID notarization. Debug stays off so lldb
          # can still attach. get-task-allow must not ship in Release.
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  OrbitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OrbitTests
      - path: Orbit/Models
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.appswitcher.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
