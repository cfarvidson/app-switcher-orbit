name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5
targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - path: Orbit
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Orbit/Resources/Orbit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.appswitcher
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Orbit/Info.plist
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
